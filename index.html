git<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mototaxi Huarmey</title>
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://wdirdbryxwtbnprbrkvh.supabase.co" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preload" href="styles.css" as="style">
    <link rel="stylesheet" href="styles.css">
    <link rel="preload" href="https://wdirdbryxwtbnprbrkvh.supabase.co/storage/v1/object/public/MotoHy/logo.webp" as="image" type="image/webp" fetchpriority="high">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap"></noscript>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/regular.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/regular.min.css">
    </noscript>
</head>
<body>
    <!-- Top Header -->
    <header class="top-header">
        <div class="header-container">
            <a href="index.html" class="brand-area" style="text-decoration: none;">
                <img src="https://wdirdbryxwtbnprbrkvh.supabase.co/storage/v1/object/public/MotoHy/logo.webp" alt="Logo" class="brand-logo" width="48" height="48" fetchpriority="high" decoding="sync">
                <div class="brand-text">
                    <h1>Mototaxi Huarmey</h1>
                    <p>CONDUCTORES VERIFICADOS EN LÍNEA</p>
                </div>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <div class="registration-card">
            <h2 class="form-title">REGÍSTRATE EN MOTOTAXI HUARMEY</h2>

            <!-- Role Selection Tabs -->
            <div id="register-section">
                <div class="tabs-container">
                <button class="tab-btn active" data-target="pasajero">
                    <i class="fa-solid fa-user"></i> Soy pasajero
                </button>
                <button class="tab-btn" data-target="mototaxista">
                    <svg width="1.1em" height="1.1em" viewBox="0 0 24 24" fill="currentColor"><path d="M19 12h-2V7.5c0-.8-.6-1.5-1.4-1.5H7.4C6.6 6 6 6.7 6 7.5V12H5c-1.1 0-2 .9-2 2v3h2c0 1.1.9 2 2 2s2-.9 2-2h6c0 1.1.9 2 2 2s2-.9 2-2h2v-3c0-1.1-.9-2-2-2zM7.5 7.5h9V11h-9V7.5zM7 17c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm10 0c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z" /></svg> Soy mototaxista
                </button>
            </div>

            <!-- Form -->
            <form id="registration-form" action="#" method="POST">
                
                <!-- Common Fields -->
                <div class="form-group">
                    <label for="fullName">Nombre Completo</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card input-icon"></i>
                        <input type="text" id="fullName" name="fullName" placeholder="Ingresa tu nombre completo" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo letras y espacios" maxlength="100" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dni">DNI / Documento de Identidad</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-address-card input-icon"></i>
                        <input type="text" id="dni" name="dni" placeholder="Ingresa tu DNI" pattern="\d{8,9}" maxlength="9" title="Debe contener 8 o 9 dígitos numéricos" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono de Contacto</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone input-icon"></i>
                        <input type="tel" id="phone" name="phone" placeholder="Ej. 987654321" pattern="\d{9}" maxlength="9" title="Debe contener exactamente 9 dígitos numéricos" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="zone">Tu zona / referencia</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-map-marker-alt input-icon"></i>
                        <select id="zone" name="zone" required>
                            <option value="" disabled selected>Selecciona una zona / destino...</option>
                            <option value="plaza_de_armas">Plaza de Armas</option>
                            <option value="iglesia_virgen_del_rosario">Iglesia Virgen del Rosario</option>
                            <option value="municipalidad_de_huarmey">Municipalidad de Huarmey</option>
                            <option value="mercado_modelo">Mercado Modelo</option>
                            <option value="hospital_de_apoyo_huarmey">Hospital de Apoyo Huarmey</option>
                            <option value="terminal_panamericana_norte">Terminal Panamericana Norte</option>
                            <option value="estadio_municipal">Estadio Municipal</option>
                            <option value="castillo_de_huarmey">Castillo de Huarmey</option>
                            <option value="playa_la_honda">Playa La Honda</option>
                            <option value="playa_tuquillo">Playa Tuquillo</option>
                        </select>
                    </div>
                </div>

                <!-- Mototaxista Specific Fields (Hidden by default) -->
                <div id="mototaxista-fields" class="hidden">
                    <div class="form-group">
                        <label for="startPoint">Punto de partida habitual</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-location-dot input-icon"></i>
                            <select id="startPoint" name="startPoint">
                                <option value="" disabled selected>Selecciona una zona / destino...</option>
                                <option value="plaza_de_armas">Plaza de Armas</option>
                                <option value="iglesia_virgen_del_rosario">Iglesia Virgen del Rosario</option>
                                <option value="municipalidad_de_huarmey">Municipalidad de Huarmey</option>
                                <option value="mercado_modelo">Mercado Modelo</option>
                                <option value="hospital_de_apoyo_huarmey">Hospital de Apoyo Huarmey</option>
                                <option value="terminal_panamericana_norte">Terminal Panamericana Norte</option>
                                <option value="estadio_municipal">Estadio Municipal</option>
                                <option value="castillo_de_huarmey">Castillo de Huarmey</option>
                                <option value="playa_la_honda">Playa La Honda</option>
                                <option value="playa_tuquillo">Playa Tuquillo</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="plateNumber">Número de placa de la mototaxi</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-hashtag input-icon"></i>
                            <input type="text" id="plateNumber" name="plateNumber" placeholder="Ej. MTX-1234" pattern="[a-zA-Z0-9-]{6,10}" maxlength="10" title="Ejemplo: MTX-1234">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="license">Número de licencia de conducir</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-id-badge input-icon"></i>
                            <input type="text" id="license" name="license" placeholder="Ej. Q12345678" pattern="[a-zA-Z0-9]{8,15}" maxlength="15" title="Ejemplo: Q12345678">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="model">Modelo de la mototaxi (Opcional)</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor"><path d="M19 12h-2V7.5c0-.8-.6-1.5-1.4-1.5H7.4C6.6 6 6 6.7 6 7.5V12H5c-1.1 0-2 .9-2 2v3h2c0 1.1.9 2 2 2s2-.9 2-2h6c0 1.1.9 2 2 2s2-.9 2-2h2v-3c0-1.1-.9-2-2-2zM7.5 7.5h9V11h-9V7.5zM7 17c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm10 0c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z" /></svg>
                            <input type="text" id="model" name="model" placeholder="Ej. Bajaj RE, TVS King" maxlength="50">
                        </div>
                    </div>
                </div>

                <!-- Password Fields (Common) -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="password-input" placeholder="Crea una contraseña" minlength="6" maxlength="8" required>
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="password-input" placeholder="Repite la contraseña" minlength="6" maxlength="8" required>
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="submit-btn">
                    <i class="fa-solid fa-user-plus btn-icon"></i>
                    <span id="submit-text">Crear mi cuenta</span>
                </button>

                <!-- Login Link -->
                <div class="login-link">
                    <span>Ya tengo cuenta:</span> <a href="#" id="show-login">INICIAR SESIÓN</a>
                </div>
            </form>
            </div>

            <!-- Login Section -->
            <div id="login-section" class="hidden">
                <form id="login-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="login-dni">DNI / Documento de Identidad</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-address-card input-icon"></i>
                            <input type="text" id="login-dni" name="login-dni" placeholder="Ingresa tu DNI" pattern="\d{8,9}" maxlength="9" title="Debe contener 8 o 9 dígitos numéricos" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="login-password" name="login-password" class="password-input" placeholder="Ingresa tu contraseña" minlength="6" maxlength="8" required>
                            <i class="fa-solid fa-eye toggle-password"></i>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fa-solid fa-right-to-bracket btn-icon"></i>
                        <span>Ingresar</span>
                    </button>

                    <div class="login-link">
                        <span>¿No tienes cuenta?</span> <a href="#" id="show-register">REGÍSTRATE AQUÍ</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
