<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pasajero - Mototaxi Huarmey</title>
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://wdirdbryxwtbnprbrkvh.supabase.co/storage/v1/object/public/MotoHy/logo.webp" as="image" fetchpriority="high">
    <link rel="preload" href="styles.css" as="style">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Header -->
    <header class="top-header">
        <div class="header-container">
            <a href="index.html" class="brand-area" style="text-decoration: none;">
                <img src="https://wdirdbryxwtbnprbrkvh.supabase.co/storage/v1/object/public/MotoHy/logo.webp" alt="Logo" class="brand-logo" width="48" height="48" fetchpriority="high" decoding="async">
                <div class="brand-text">
                    <h1>Mototaxi Huarmey</h1>
                    <p>CONDUCTORES VERIFICADOS EN LÍNEA</p>
                </div>
            </a>
            
            <a href="index.html" class="logout-btn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span class="logout-text">Cerrar sesión</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container dashboard-main">
        
        <!-- Greeting Section -->
        <div class="greeting-section">
            <h2 id="user-greeting">Bienvenido, <span>Usuario</span></h2>
            <p id="user-zone">Zona / Referencia: <span>Centro de Huarmey</span></p>
        </div>

        <!-- Route Selection Card -->
        <div class="registration-card route-card">
            <h2 class="form-title" style="color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i class="fa-regular fa-compass"></i> A DÓNDE VAS
            </h2>

            <form id="route-form" action="#" method="POST">
                <div class="form-group">
                    <label for="origen">Desde</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-location-arrow input-icon"></i>
                        <select id="origen" name="origen" required>
                            <option value="" disabled selected>Selecciona un punto de origen</option>
                            <option value="plaza_de_armas">Plaza de Armas</option>
                            <option value="iglesia_virgen_del_rosario">Iglesia Virgen del Rosario</option>
                            <option value="municipalidad_de_huarmey">Municipalidad de Huarmey</option>
                            <option value="mercado_modelo">Mercado Modelo</option>
                            <option value="hospital_de_apoyo_huarmey">Hospital de Apoyo Huarmey</option>
                            <option value="terminal_panamericana_norte">Terminal Panamericana Norte</option>
                            <option value="estadio_municipal">Estadio Municipal</option>
                            <option value="castillo_de_huarmey">Castillo de Huarmey</option>
                            <option value="playa_la_honda">Playa La Honda</option>
                            <option value="playa_tuquillo">Playa Tuquillo</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="destino">Hacia</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-location-dot input-icon"></i>
                        <select id="destino" name="destino" required>
                            <option value="" disabled selected>Selecciona un destino</option>
                            <option value="plaza_de_armas">Plaza de Armas</option>
                            <option value="iglesia_virgen_del_rosario">Iglesia Virgen del Rosario</option>
                            <option value="municipalidad_de_huarmey">Municipalidad de Huarmey</option>
                            <option value="mercado_modelo">Mercado Modelo</option>
                            <option value="hospital_de_apoyo_huarmey">Hospital de Apoyo Huarmey</option>
                            <option value="terminal_panamericana_norte">Terminal Panamericana Norte</option>
                            <option value="estadio_municipal">Estadio Municipal</option>
                            <option value="castillo_de_huarmey">Castillo de Huarmey</option>
                            <option value="playa_la_honda">Playa La Honda</option>
                            <option value="playa_tuquillo">Playa Tuquillo</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="submit-btn" style="margin-top: 10px;">
                    <i class="fa-solid fa-motorcycle btn-icon"></i>
                    <span>Solicitar Mototaxi</span>
                </button>
            </form>
        </div>

        <!-- Integrated Map Container -->
        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31877.719854083974!2d-78.17469608486687!3d-10.062317257159611!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91aa164a0cbab349%3A0xaefe982abe020fd4!2sHuarmey!5e1!3m2!1ses!2spe!4v1786762546172!5m2!1ses!2spe" width="100%" height="400" style="border:0; border-radius: 12px;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>

    </main>

</body>
</html>
